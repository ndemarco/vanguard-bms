[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard"
version = "0.1.0"
description = "Decoder, encoder and pack simulator for the reverse-engineered Vanguard 14S BMS CAN protocol"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]
test = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "httpx>=0.27"]

[project.scripts]
vanguard-app = "vanguard.web.cli:main"

[tool.setuptools.package-data]
"vanguard.web" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
