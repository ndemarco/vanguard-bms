# Vanguard bridge configuration. Install as /etc/vanguard-bridge/bridge.toml.
# Read by the bridge (vanguard-bridge) and by the interface setup (vanguard-bridge-netsetup),
# so the pack-bus-to-interface mapping lives only here. The bridge prints it at startup.
#
# Which HAT channel is wired to which pack bus is YOUR wiring choice. Kernel names can0/can1
# come from probe order and are not tied to a HAT terminal, so each bus also names the SPI
# device its CAN controller sits on; both programs refuse to run if /sys/class/net/<interface>/device
# does not resolve to that SPI device. With the Waveshare overlays (config.txt.snippet):
#   spi0.0 = MCP2518FD on SPI0 CE0, INT on GPIO 25
#   spi1.0 = MCP2518FD on SPI1 CE0, INT on GPIO 24

[pack_can1]
# Pack CAN1: 11-bit IDs. The only bus the bridge transmits on (0x105, 0x515 allowlist).
interface = "can0"
spi_device = "spi0.0"

[pack_can2]
# Pack CAN2: 29-bit IDs. Receive only. A tc filter dropping every frame is always installed.
interface = "can1"
spi_device = "spi1.0"
# Active: the controller is in listen-only mode (never ACKs, never transmits).
guard = "listen-only"
# Fallback, only if listen-only makes the pack retransmit one frame forever (no other node on
# CAN2 to ACK it): the controller runs in normal mode so it ACKs, and the drop-all tc filter is
# what keeps it from transmitting frames. Comment the line above and uncomment this one, then
# restart vanguard-can-setup.service and vanguard-bridge.service.
# guard = "tc-drop-all"

[socket]
# Unix stream socket for the one controlling client (the web app).
path = "/run/vanguard-bridge/bridge.sock"
# Octal; must not grant access to others.
mode = "0660"
# Members of this group may connect. The web app's user must be in it.
group = "vanguard"

[checks]
# While running, re-run the interface checks this often (seconds). A failure stops and exits.
recheck_interval_s = 5
